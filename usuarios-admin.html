<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar Usuarios — Sistema Escolar Chavarría</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    body { max-width: 750px; margin: 0 auto; padding: 20px; background: #f0f4f8; }
    h1 { text-align: center; color: #1e3a8a; margin-bottom: 25px; }
    .tarjeta { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { color: #1e40af; margin-bottom: 18px; font-size: 18px; }
    .campo { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; }
    input, button { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; }
    button { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
    button:hover { background: #1d4ed8; }
    .fila { display: flex; gap: 15px; flex-wrap: wrap; }
    .fila .campo { flex: 1; min-width: 200px; }
    .checks { display: flex; gap: 20px; margin: 15px 0; flex-wrap: wrap; }
    .checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: normal; }

    .resultado { margin-top: 20px; padding: 18px; background: #ecfdf5; border: 1px solid #10b981; border-radius: 8px; display: none; }
    .resultado.activo { display: block; }
    .dato { margin: 10px 0; font-size: 15px; }
    .etiqueta { font-weight: bold; color: #065f46; }
    .valor { font-family: monospace; background: #d1fae5; padding: 4px 10px; border-radius: 4px; margin-left: 6px; }

    .btn-whatsapp { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #25D366; color: white !important; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px; margin-top: 15px; width: 100%; }
    .btn-whatsapp:hover { background: #1fb855; }

    .lista { margin-top: 10px; }
    .usuario { padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    .rol { font-weight: bold; color: #1e40af; font-size: 14px; }

    #msgPass { margin-top: 12px; display: none; font-weight: 600; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

<h1>🏫 Administración de Usuarios</h1>

<div class="tarjeta">
  <h2>➕ Crear Nuevo Usuario</h2>

  <div class="fila">
    <div class="campo">
      <label>Nombre completo:</label>
      <input type="text" id="nombre" placeholder="Nombre y apellidos" autocomplete="off" required>
    </div>
    <div class="campo">
      <label>Correo (antes del @):</label>
      <input type="text" id="correoBase" placeholder="nombre.apellido" autocomplete="off" required>
    </div>
  </div>

  <div class="fila">
    <div class="campo">
      <label>📞 Teléfono (solo números):</label>
      <input type="tel" id="telefono" placeholder="312XXXXXXX" autocomplete="off" required>
    </div>
  </div>

  <div class="checks">
    <label><input type="checkbox" id="esSubadmin"> Subadministrador</label>
    <label><input type="checkbox" id="eco"> Escuela de Consolidación (ECO)</label>
    <label><input type="checkbox" id="em"> Escuela de Ministerios (EM)</label>
  </div>

  <button id="btnCrear">✅ Crear Usuario</button>

  <div id="cajaResultado" class="resultado">
    <div class="dato">
      <span class="etiqueta">✅ Creado:</span>
      <span id="resCorreo" class="valor"></span>
    </div>
    <div class="dato">
      <span class="etiqueta">🔑 Contraseña temporal:</span>
      <span id="resContra" class="valor"></span>
    </div>
    <a id="botonWA" href="" target="_blank" class="btn-whatsapp">
      📱 Enviar por WhatsApp
    </a>
  </div>
</div>

<div class="tarjeta">
  <h2>🔐 Cambiar Mi Contraseña</h2>
  <div class="campo">
    <label>Contraseña actual:</label>
    <input type="password" id="passActual" placeholder="Escribe tu contraseña de ahora">
  </div>
  <div class="campo">
    <label>Contraseña nueva:</label>
    <input type="password" id="passNueva1" placeholder="Escribe tu contraseña nueva">
  </div>
  <div class="campo">
    <label>Repetir contraseña nueva:</label>
    <input type="password" id="passNueva2" placeholder="Vuelve a escribirla">
  </div>
  <button id="btnCambiarPass">🔄 Cambiar Contraseña</button>
  <p id="msgPass"></p>
</div>

<div class="tarjeta">
  <h2>👥 Usuarios del Sistema</h2>
  <div id="listaUsuarios" class="lista">Cargando...</div>
</div>

<script>
// TUS DATOS DE FIREBASE — ya configurados
const firebaseConfig = {
  apiKey: "AIzaSyD9xxxxxxxxxxxxxxxxxxxxxxxxxxxx",
  authDomain: "sistema-escolar-chavarria.firebaseapp.com",
  projectId: "sistema-escolar-chavarria",
  storageBucket: "sistema-escolar-chavarria.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl01"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const DOMINIO = "@terceradecolima.edu.iafcj";

function generarContrasena() {
  const may = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const min = "abcdefghjkmnpqrstuvwxyz";
  const num = "23456789";
  let c = may[Math.floor(Math.random() * may.length)];
  c += min[Math.floor(Math.random() * min.length)];
  c += num[Math.floor(Math.random() * num.length)];
  for (let i = 0; i < 5; i++) {
    const t = may + min + num;
    c += t[Math.floor(Math.random() * t.length)];
  }
  return c.split('').sort(() => 0.5 - Math.random()).join('');
}

async function cargarLista() {
  const lista = document.getElementById('listaUsuarios');
  try {
    const snap = await db.collection('usuarios').orderBy('nombre').get();
    if (snap.empty) {
      lista.innerHTML = "<p style='color:#6b7280;'>No hay usuarios registrados</p>";
      return;
    }
    lista.innerHTML = "";
    snap.forEach(doc => {
      const u = doc.data();
      lista.innerHTML += `
        <div class="usuario">
          <div><strong>${u.nombre}</strong></div>
          <div class="rol">${u.rol}</div>
          <div style="font-size:13px; color:#6b7280;">${u.correo}</div>
        </div>
      `;
    });
  } catch (e) {
    lista.innerHTML = "<p style='color:red;'>Error al cargar usuarios</p>";
  }
}

document.getElementById('btnCrear').addEventListener('click', async () => {
  const nombre = document.getElementById('nombre').value.trim();
  const correoBase = document.getElementById('correoBase').value.trim().toLowerCase();
  const telefono = document.getElementById('telefono').value.trim().replace(/\D/g, '');
  const esSubadmin = document.getElementById('esSubadmin').checked;
  const eco = document.getElementById('eco').checked;
  const em = document.getElementById('em').checked;

  if (!nombre || !correoBase || telefono.length < 10) {
    alert('Completa todos los campos correctamente');
    return;
  }

  const correoCompleto = correoBase + DOMINIO;
  const contrasena = generarContrasena();
  const rol = esSubadmin ? 'Subadministrador' : 'Usuario';

  try {
    await auth.createUserWithEmailAndPassword(correoCompleto, contrasena);
    await db.collection('usuarios').add({
      nombre, correo: correoCompleto, rol, eco, em, telefono, creado: new Date()
    });

    document.getElementById('resCorreo').textContent = correoCompleto;
    document.getElementById('resContra').textContent = contrasena;

    const mensaje = encodeURIComponent(
`👋 ¡Hola! Te comparto tus datos de acceso al sistema:

📧 Usuario: ${correoCompleto}
🔑 Contraseña temporal: ${contrasena}

👉 Entra y baja hasta donde dice "Cambiar Mi Contraseña" para poner una tuya ✅

Saludos!`
    );
    document.getElementById('botonWA').href = `https://wa.me/52${telefono}?text=${mensaje}`;

    document.getElementById('cajaResultado').classList.add('activo');

    document.getElementById('nombre').value = '';
    document.getElementById('correoBase').value = '';
    document.getElementById('telefono').value = '';
    document.getElementById('esSubadmin').checked = false;
    document.getElementById('eco').checked = false;
    document.getElementById('em').checked = false;

    cargarLista();
  } catch (error) {
    console.error(error);
    alert('Error: ' + error.message);
  }
});

document.getElementById('btnCambiarPass').addEventListener('click', async () => {
  const user = auth.currentUser;
  if (!user) {
    alert('Primero debes iniciar sesión');
    return;
  }

  const actual = document.getElementById('passActual').value;
  const nueva1 = document.getElementById('passNueva1').value;
  const nueva2 = document.getElementById('passNueva2').value;
  const msg = document.getElementById('msgPass');

  msg.style.display = 'none';

  if (!actual || !nueva1 || !nueva2) {
    msg.textContent = '⚠️ Llena todos los campos';
    msg.style.color = '#d97706';
    msg.style.display = 'block';
    return;
  }
  if (nueva1 !== nueva2) {
    msg.textContent = '⚠️ Las contraseñas nuevas no son iguales';
    msg.style.color = '#d97706';
    msg.style.display = 'block';
    return;
  }
  if (nueva1.length < 6) {
    msg.textContent = '⚠️ La contraseña debe tener al menos 6 caracteres';
    msg.style.color = '#d97706';
    msg.style.display = 'block';
    return;
  }

  try {
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, actual);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(nueva1);

    msg.textContent = '✅ ¡Contraseña cambiada con éxito! Ya puedes usar la nueva.';
    msg.style.color = '#059653';
    msg.style.display = 'block';

    document.getElementById('passActual').value = '';
    document.getElementById('passNueva1').value = '';
    document.getElementById('passNueva2').value = '';

  } catch (error) {
    if (error.code === 'auth/wrong-password') {
      msg.textContent = '❌ La contraseña actual no es correcta';
    } else {
      msg.textContent = '❌ Error: ' + error.message;
    }
    msg.style.color = '#dc2626';
    msg.style.display = 'block';
  }
});

cargarLista();
</script>

</body>
</html>
