<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración de Usuarios</title>
</head>
<body>

  <h1>Administración de Usuarios</h1>

  <h3>+ Crear Nuevo Usuario</h3>
  <div>
    <label>Nombre completo:</label><br>
    <input type="text" id="nombreCompleto" placeholder="Nombre completo"><br><br>

    <label>Correo (antes del @):</label><br>
    <input type="text" id="correoParte" placeholder="felipe.avalos"><br><br>

    <label>WhatsApp (solo números):</label><br>
    <input type="text" id="whatsapp" placeholder="312..."><br><br>

    <label>
      <input type="checkbox" id="esSubAdmin"> Subadministrador
    </label><br>
    <label>
      <input type="checkbox" id="esEco"> Escuela de Formación (ECO)
    </label>
    <label>
      <input type="checkbox" id="esEm"> Escuela de Ministros (EM)
    </label><br><br>

    <button onclick="crearUsuario()">Crear Usuario</button>
  </div>

  <hr>

  <h3>Usuarios del Sistema</h3>
  <div id="listaUsuarios"></div>

  <br>
  <button onclick="cerrarSesion()">Cerrar Sesión</button>


  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // =============================================
    // PON AQUÍ TUS DATOS DE FIREBASE — VERIFICA ESTO
    // =============================================
    const firebaseConfig = {
      apiKey: "AQUÍ_TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      projectId: "TU_PROYECTO",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "NUMERO_ID",
      appId: "TU_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // =============================================
    // CARGAR LISTA — SIN ORDENAR PARA QUE NO FALLE
    // =============================================
    async function cargarLista() {
      const lista = document.getElementById('listaUsuarios');
      try {
        // Lee TODOS sin exigir orden — así no falla si falta algún campo
        const snap = await db.collection('usuarios').get();
        
        if (snap.empty) {
          lista.innerHTML = "<p style='color:#6b7280;'>No hay usuarios registrados</p>";
          return;
        }
        
        lista.innerHTML = "";
        snap.forEach(doc => {
          const u = doc.data();
          
          // Detectar rol
          let rolUsuario = 'Usuario';
          if (u.roles?.subAdmin === true) rolUsuario = 'Subadministrador';
          if (u.roles?.superAdmin === true) rolUsuario = 'Administrador';
          
          // Mostrar datos — acepta cualquiera de los dos nombres
          const nombre = u.nombreCompleto || u.nombre || 'Sin nombre';
          const correo = u.email || u.correo || 'Sin correo';
          const telefono = u.whatsapp || u.telefono || '';
          
          lista.innerHTML += `
            <div style="border:1px solid #ddd; padding:12px; margin:8px 0; border-radius:6px;">
              <div><strong>${nombre}</strong></div>
              <div style="color:#555; margin:4px 0;">${rolUsuario}</div>
              <div style="font-size:13px; color:#777;">${correo}</div>
              ${telefono ? `<a href="https://wa.me/${telefono}" target="_blank" style="display:inline-block; margin-top:6px;">📩 Enviar por WhatsApp</a>` : ''}
            </div>
          `;
        });
      } catch (e) {
        console.error(e);
        lista.innerHTML = `<p style='color:red;'>ERROR: ${e.message}</p>`;
      }
    }

    // =============================================
    // CREAR USUARIO
    // =============================================
    async function crearUsuario() {
      const nombreCompleto = document.getElementById('nombreCompleto').value.trim();
      const correoParte = document.getElementById('correoParte').value.trim();
      const numWhatsApp = document.getElementById('whatsapp').value.trim();
      const esSubAdmin = document.getElementById('esSubAdmin').checked;
      const esEco = document.getElementById('esEco').checked;
      const esEm = document.getElementById('esEm').checked;

      if (!nombreCompleto || !correoParte || !numWhatsApp) {
        alert('Llena todos los campos');
        return;
      }

      const correoCompleto = correoParte + '@terceradecolima.edu.iafcj';
      const contraseñaTemp = Math.random().toString(36).slice(-8);

      try {
        await auth.createUserWithEmailAndPassword(correoCompleto, contraseñaTemp);
        
        await db.collection('usuarios').doc(correoCompleto).set({
          nombreCompleto: nombreCompleto,
          email: correoCompleto,
          whatsapp: numWhatsApp,
          contraseñaTemporal: true,
          eco: esEco,
          em: esEm,
          roles: {
            subAdmin: esSubAdmin,
            superAdmin: false
          },
          creadoPor: auth.currentUser.email,
          fechaCreacion: new Date()
        });

        alert('✅ Usuario creado!\nContraseña temporal: ' + contraseñaTemp);
        cargarLista();
        
        // Limpiar formulario
        document.getElementById('nombreCompleto').value = '';
        document.getElementById('correoParte').value = '';
        document.getElementById('whatsapp').value = '';
        document.getElementById('esSubAdmin').checked = false;
        document.getElementById('esEco').checked = false;
        document.getElementById('esEm').checked = false;

      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    function cerrarSesion() {
      auth.signOut().then(() => window.location.href = 'index.html');
    }

    auth.onAuthStateChanged(u => {
      if (!u) window.location.href = 'index.html';
      else cargarLista();
    });
  </script>

</body>
</html>
