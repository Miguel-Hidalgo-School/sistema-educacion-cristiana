<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Iniciar Sesión</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:linear-gradient(135deg,#1e3a8a 0%,#b45309 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.caja{background:white;padding:35px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);width:90%;max-width:400px}
h1{text-align:center;color:#1f2937;margin-bottom:25px;font-size:1.5rem}
.campo{margin-bottom:18px}
label{display:block;margin-bottom:6px;font-weight:bold;color:#374151}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem}
button{width:100%;padding:13px;background:#9a3412;color:white;border:none;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:5px}
button:hover{background:#7c2d12}
#mensaje{margin-top:15px;padding:10px;border-radius:6px;text-align:center;display:none;font-weight:bold}
.error{background:#fee2e2;color:#b91c1c}
.exito{background:#d1fae5;color:#065f46}
</style>
</head>
<body>

<div class="caja">
<h1>🔐 Iniciar Sesión</h1>

<div class="campo">
<label>Correo electrónico</label>
<input type="email" id="correo" required>
</div>

<div class="campo">
<label>Contraseña</label>
<input type="password" id="clave" required>
</div>

<button id="btnEntrar">✅ Entrar</button>

<div id="mensaje"></div>
</div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<script>
const app = firebase.initializeApp(window.firebaseConfig);
const auth = firebase.auth();

const btnEntrar = document.getElementById('btnEntrar');
const mensaje = document.getElementById('mensaje');

btnEntrar.addEventListener('click', async () => {
  const correo = document.getElementById('correo').value.trim();
  const clave = document.getElementById('clave').value;
  
  if(!correo || !clave) return mostrarMensaje('Escribe correo y contraseña', 'error');
  
  btnEntrar.disabled = true;
  btnEntrar.textContent = 'Verificando...';
  mensaje.style.display = 'none';
  
  try {
    await auth.signInWithEmailAndPassword(correo, clave);
    mostrarMensaje('✅ Acceso correcto...', 'exito');
    setTimeout(() => window.location.href = 'index.html', 800);
  } catch (err) {
    btnEntrar.disabled = false;
    btnEntrar.textContent = '✅ Entrar';
    let texto = 'Error de acceso';
    if(err.code === 'auth/user-not-found') texto = 'No existe este correo';
    if(err.code === 'auth/wrong-password') texto = 'Contraseña incorrecta';
    if(err.code === 'auth/too-many-requests') texto = 'Demasiados intentos — intenta más tarde';
    mostrarMensaje(texto, 'error');
  }
});

function mostrarMensaje(texto, tipo){
  mensaje.textContent = texto;
  mensaje.className = tipo;
  mensaje.style.display = 'block';
}
</script>

</body>
</html>
