<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sistema Escolar — Chavarría Producciones</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:linear-gradient(135deg,#1a56db 0%,#2563eb 100%);min-height:100vh;padding:30px 20px}
.container{max-width:900px;margin:0 auto}
.header{text-align:center;color:white;margin-bottom:40px}
.logo{font-size:1.8rem;font-weight:bold;margin-bottom:8px}
.subtitulo{opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:white;border-radius:12px;padding:25px;text-align:center;text-decoration:none;color:#1e293b;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:transform .2s}
.card:hover{transform:translateY(-5px)}
.icon{font-size:2.5rem;margin-bottom:12px}
.titulo{font-weight:bold;font-size:1.1rem;margin-bottom:5px}
.desc{font-size:.9rem;color:#64748b}
.footer{text-align:center;color:white;margin-top:40px;opacity:.7;font-size:.85rem}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo">🎓 Chavarría Producciones</div>
<h1>Sistema de Gestión Escolar</h1>
<p class="subtitulo">Panel Principal</p>
</div>
<div class="grid">
<a href="alumnos.html" class="card"><div class="icon">👥</div><div class="titulo">Alumnos</div><div class="desc">Registro y consulta</div></a>
<a href="docentes.html" class="card"><div class="icon">👨‍🏫</div><div class="titulo">Docentes</div><div class="desc">Maestros y personal</div></a>
<a href="materias.html" class="card"><div class="icon">📚</div><div class="titulo">Materias</div><div class="desc">Asignaturas y planes</div></a>
<a href="calificaciones.html" class="card"><div class="icon">✏️</div><div class="titulo">Calificaciones</div><div class="desc">Evaluaciones y boletas</div></a>
<a href="asistencia.html" class="card"><div class="icon">📅</div><div class="titulo">Asistencia</div><div class="desc">Registro diario</div></a>
<a href="pagos.html" class="card"><div class="icon">💰</div><div class="titulo">Pagos</div><div class="desc">Inscripciones y cuotas</div></a>
</div>
<div class="footer">© 2026 Chavarría Producciones</div>
</div>
</body>
</html>
