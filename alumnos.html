<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Alumnos — Chavarría Producciones</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#f0f4f8;padding:20px;max-width:900px;margin:0 auto}
.volver{display:inline-block;margin-bottom:15px;color:#1a56db;text-decoration:none;font-weight:500}
h1{text-align:center;color:#1a56db;margin:20px 0}
h2{color:#2563eb;margin:25px 0 15px 0}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1);margin-bottom:25px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:5px;font-weight:500;color:#333}
input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font-size:1rem}
button{padding:12px 25px;background:#1a56db;color:white;border:none;border-radius:6px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{background:#1548c5}
.ok{background:#dcfce7;color:#166534;padding:12px;border-radius:6px;margin-top:15px;display:none;text-align:center}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}
th{background:#f8fafc;font-weight:bold;color:#1e293b}
tr:hover{background:#f8fafc}
.vacio{text-align:center;color:#64748b;padding:30px}
.cargando{text-align:center;color:#2563eb;padding:20px}
</style>
</head>
<body>

<a href="index.html" class="volver">← Volver al Menú</a>
<h1>🎓 Gestión de Alumnos</h1>

<!-- FORMULARIO DE REGISTRO -->
<div class="card">
<h2>➕ Agregar Nuevo Alumno</h2>
<form id="formAlumno">
<div class="form-row">
<div class="form-group">
<label>Nombre Completo</label>
<input type="text" id="nombreCompleto" required>
</div>
<div class="form-group">
<label>Matrícula</label>
<input type="text" id="matricula" required>
</div>
<div class="form-group">
<label>Grado</label>
<input type="number" id="grado" required min="1" max="12">
</div>
<div class="form-group">
<label>Grupo</label>
<input type="text" id="grupo" required maxlength="3">
</div>
<div class="form-group">
<label>Correo</label>
<input type="email" id="correo" required>
</div>
<div class="form-group">
<label>Fecha Ingreso</label>
<input type="date" id="fechaIngreso" required>
</div>
<div class="form-group">
<label>Estatus</label>
<select id="status">
<option value="inscrito">Inscrito</option>
<option value="baja">Baja</option>
<option value="suspendido">Suspendido</option>
</select>
</div>
</div>
<button type="submit">✅ Guardar Alumno</button>
<div class="ok" id="mensajeExito">✅ Alumno guardado — la lista se actualiza abajo</div>
</form>
</div>

<!-- LISTA DE ALUMNOS REGISTRADOS -->
<div class="card">
<h2>📋 Lista de Alumnos</h2>
<div id="lista">
<div class="cargando">Cargando...</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
// ===== TU CONFIGURACIÓN DE FIREBASE =====
const firebaseConfig = {
apiKey: "AQUÍ_TU_API_KEY",
authDomain: "TU_PROYECTO.firebaseapp.com",
projectId: "TU_PROYECTO",
storageBucket: "TU_PROYECTO.appspot.com",
messagingSenderId: "123456789",
appId: "1:123456789:web:abc123"
};
// =========================================

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ✅ Función para cargar y mostrar la lista
async function cargarLista() {
  const lista = document.getElementById('lista');
  lista.innerHTML = '<div class="cargando">Cargando...</div>';
  
  try {
    const snapshot = await db.collection('alumnos').orderBy('nombreCompleto').get();
    
    if (snapshot.empty) {
      lista.innerHTML = '<div class="vacio">📭 No hay alumnos registrados aún</div>';
      return;
    }
    
    let html = '<table><tr><th>Nombre</th><th>Matrícula</th><th>Grado/Grupo</th><th>Correo</th><th>Estatus</th></tr>';
    
    snapshot.forEach(doc => {
      const a = doc.data();
      html += `
        <tr>
          <td>${a.nombreCompleto || '-'}</td>
          <td>${a.matricula || '-'}</td>
          <td>${a.grado || '-'}/${a.grupo || '-'}</td>
          <td>${a.correo || '-'}</td>
          <td>${a.status || '-'}</td>
        </tr>`;
    });
    
    html += '</table>';
    lista.innerHTML = html;
    
  } catch (error) {
    lista.innerHTML = `<div style="color:red">Error al cargar: ${error.message}</div>`;
  }
}

// ✅ Guardar nuevo alumno
document.getElementById('formAlumno').addEventListener('submit', async e => {
  e.preventDefault();
  
  const datos = {
    nombreCompleto: document.getElementById('nombreCompleto').value,
    matricula: document.getElementById('matricula').value,
    grado: parseInt(document.getElementById('grado').value),
    grupo: document.getElementById('grupo').value,
    correo: document.getElementById('correo').value,
    fechaIngreso: new Date(document.getElementById('fechaIngreso').value),
    status: document.getElementById('status').value
  };
  
  try {
    await db.collection('alumnos').add(datos);
    document.getElementById('mensajeExito').style.display = 'block';
    document.getElementById('formAlumno').reset();
    setTimeout(() => document.getElementById('mensajeExito').style.display = 'none', 3000);
    
    // 🔄 Actualizar la lista automáticamente
    cargarLista();
    
  } catch (error) {
    alert('Error: revisa tu configuración de Firebase');
  }
});

// ✅ Cargar la lista al abrir la página
cargarLista();
</script>

</body>
</html>
