<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Registro de Alumnos</title>
<style>
*{margin:0;padding:0;font-family:Segoe UI,sans-serif}
body{background:#f0f4f8;padding:20px;max-width:450px;margin:0 auto}
h2{text-align:center;margin:20px 0;color:#1a56db}
form{background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
label{display:block;margin:15px 0 5px 0;font-weight:500}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:1rem}
button{width:100%;padding:14px;background:#1a56db;color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:bold;margin-top:20px;cursor:pointer}
.ok{margin-top:15px;padding:12px;background:#dcfce7;color:green;border-radius:6px;display:none;text-align:center}
</style>
</head>
<body>
<h2>📋 Registro de Alumnos</h2>
<form id="f">
<label>Nombre Completo</label><input type="text" id="nom" required>
<label>Matrícula</label><input type="text" id="mat" required>
<label>Grado</label><input type="number" id="gra" required>
<label>Grupo</label><input type="text" id="gru" required>
<label>Correo Electrónico</label><input type="email" id="cor" required>
<label>Fecha de Ingreso</label><input type="date" id="fec" required>
<label>Estatus</label>
<select id="est">
<option value="inscrito">Inscrito</option>
<option value="baja">Baja</option>
</select>
<button type="submit">✅ Guardar Alumno</button>
<div class="ok" id="ok">✅ Guardado correctamente</div>
</form>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
apiKey: "AQUÍ_TU_API_KEY",
authDomain: "TU_PROYECTO.firebaseapp.com",
projectId: "TU_PROYECTO",
storageBucket: "TU_PROYECTO.appspot.com",
messagingSenderId: "123456789",
appId: "1:123456789:web:abc123"
};
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
document.getElementById('f').addEventListener('submit',async e=>{
e.preventDefault();
await db.collection('alumnos').add({
nombreCompleto:document.getElementById('nom').value,
matricula:document.getElementById('mat').value,
grado:parseInt(document.getElementById('gra').value),
grupo:document.getElementById('gru').value,
correo:document.getElementById('cor').value,
fechaIngreso:new Date(document.getElementById('fec').value),
status:document.getElementById('est').value
});
document.getElementById('ok').style.display='block';
document.getElementById('f').reset();
setTimeout(()=>document.getElementById('ok').style.display='none',3000);
})
</script>
</body>
</html>
